kind = "web"
previewPath = "/"
title = "Artha – Financial Research AI"
version = "1.0.0"
id = "artifacts/artha"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23641

[services.development]
run = "pnpm --filter @workspace/artha run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/artha", "run", "build" ]
serve = "static"
publicDir = "artifacts/artha/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23641"
BASE_PATH = "/"
